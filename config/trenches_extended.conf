# trenches.conf -- one line per trench, used by trace_axes.sh
#
#   name  pb2002_pair  lon_min  lon_max  lat_min  lat_max
#
# The PB2002 subduction segment is only a SEED: it locates the margin, and the
# axis is then snapped to the local depth minimum in the bathymetric grid, so
# the published boundary does not constrain the result.
#
# Every pair code and box below was derived from the extent of the PB2002
# subduction segments themselves, not assumed. Longitudes are 0-360.
#
