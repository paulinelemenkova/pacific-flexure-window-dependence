#
# NOT DEFINED BY A PB2002 SUBDUCTION SEGMENT -- these three need a seed
# digitised by hand (a few points along the deep is enough; the snapping step
# does the rest). See the note printed by trace_axes.sh.
#   palau        no subduction segment in PB2002 near 134E, 7N
#   vityaz       relict trench, no active plate boundary in PB2002
# Build their seeds with seed_from_grid.sh, then add lines here in the form
#   palau           SEED    132.0   137.0     4.0    10.0
#   vityaz          SEED    169.0   177.0   -18.0   -10.0
# trace_axes.sh reads seeds/<name>.txt when the pair code is SEED.
palau             SEED    134.6   135.6     6.8     8.2
vityaz            SEED    169.5   171.2   -10.8   -10.0
