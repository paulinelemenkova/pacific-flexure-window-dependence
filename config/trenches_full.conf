# trenches_full.conf -- one line per trench, used by trace_axes.sh
#
#   name  pb2002_pair  lon_min  lon_max  lat_min  lat_max
#
# Longitudes 0-360. The PB2002 subduction segment is only a SEED: it locates
# the margin, and the axis is then snapped to the local depth minimum in the
# bathymetric grid, so the published boundary does not constrain the result.
#
# WHAT CHANGED FROM trenches_extended.conf, AND WHY
# -------------------------------------------------
# Profile coverage reached only 76 per cent of the traced axes (23,206 of
# 30,570 km), and eight trenches fell well below that. Comparing the profile
# extent with the box shows two distinct causes.
#
# BOX-LIMITED -- the axis filled the box and stopped. Widened below:
#   peru-chile      covered 22.1S-35.6S against a box ending at 21.5N; only
#                   1554 km of a ~6000 km margin, so the whole Peru and
#                   northern Chile segment was absent. Box now runs to 3N.
#   middle_america  hard against all four edges, 1738 of ~2750 km.
#   palau           hard against all four edges, 122 of ~350 km.
#   vityaz          hard against all four edges, 43 km on three profiles.
#   hikurangi       clipped at its southern edge -- AND it shared an IDENTICAL
#                   box with kermadec (175.00 185.51 -42.56 -23.25), so both
#                   trenches competed for the same seed and Hikurangi kept
#                   only six profiles. The two are now split at 37S.
#
# NOT BOX-LIMITED -- these need the seed checked, not the box:
#   aleutian        starts at 181.1E inside a box opening at 163.6E, so about
#                   1200 km of western Aleutian axis lies inside the box and
#                   was never traced. Check whether the NA/PA seed extends
#                   that far west; axes_report.txt records the node count.
#   san_cristobal   sits entirely inside its box with room on every side.
#   puysegur        clipped south and west but covers only 253 of 600 km.
# The boxes below are still widened for these three so that a corrected seed
# is not clipped, but widening alone will not extend them.
#
# RYUKYU is a separate defect: its traced axis runs 2389 km with its endpoints
# 38 km apart, because the old seed step concatenated three disjoint ON/PS
# pieces into a self-crossing path. Fixed by prepare_seed.py, not by the box.
#
# THE OKINAWA TROUGH runs parallel to the Ryukyu Trench and no rectangle
# separates them: the trough spans 123-130E and 24.5-31N, inside any box that
# holds the trench. The separation is made on depth instead, by guard_axis.py
# (trough 1000-2200 m against the trench's 6747 m median). The Ryukyu box is
# kept as tight as the margin allows regardless.
#
# TWO TRENCHES SPAN SEVERAL PB2002 PAIR CODES, because the code names the
# plate pair and the OVERRIDING plate changes along strike. Taking only the
# first code is what truncated them:
#   peru-chile      NZ\SA (Chile, 2695 km) - NZ\AP (Altiplano, 901) -
#                   NZ\SA (Peru, 1602) - NZ\ND (North Andes, 751). The four
#                   pieces are contiguous end to end; using NZ\SA alone gave
#                   2695 km of a 5949 km margin.
#   middle_america  CO\NA - NA/RI (Rivera, north) - CO\PM and CA/CO (Panama
#                   and Caribbean, south): 3148 km against 1710 km.
# NOTE this changes the plate pair printed in Table 1 for both trenches.
#
# CODES DELIBERATELY NOT ADDED, although they fall inside a box: OK/NA at the
# Aleutian west end (a different boundary, not Pacific subduction), SS\WL at
# New Britain (the Trobriand system), and KE/PA in the Tonga box, PS/PA in the
# Mariana box and PA/WL at San Cristobal, which are neighbouring trenches
# caught by box overlap and correctly excluded by the code filter.
#
# CASCADIA is added: it carries seismicity and a Table 1 row but has never had
# an axis. VERIFY the pair code against pb2002_subduction.txt before running.
#
